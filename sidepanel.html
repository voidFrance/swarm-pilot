<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Swarm Pilot</title>
<style>
  :root { color-scheme: dark; --neon: #22d3ee; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0c0d10; color: #e7e9ee; display: flex; flex-direction: column;
    font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    background: #13151a; border-bottom: 1px solid #22252c; flex: 0 0 auto;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 8px #4ade80; flex: 0 0 auto; }
  .dot.busy { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; animation: pulse 1s infinite; }
  .dot.err { background: #f87171; box-shadow: 0 0 8px #f87171; }
  @keyframes pulse { 50% { opacity: .35; } }
  .title { font-weight: 600; letter-spacing: .2px; white-space: nowrap; }
  .meta { color: #6b7280; font-size: 10.5px; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  .icon {
    background: none; border: 1px solid transparent; color: #9ca3af; cursor: pointer;
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 13px; padding: 0;
  }
  .icon:hover { background: #1d2026; color: #e5e7eb; }
  .target {
    color: #6b7280; font-size: 10px; padding: 4px 10px; border-bottom: 1px solid #16181d;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto;
  }
  .target b { color: #93c5fd; font-weight: 500; }
  .log { flex: 1 1 auto; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
  .log::-webkit-scrollbar { width: 6px; }
  .log::-webkit-scrollbar-thumb { background: #2a2e37; border-radius: 3px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .msg.user { color: #93c5fd; padding-left: 8px; border-left: 2px solid #1e3a8a; }
  .msg.assistant { color: #e5e7eb; }
  .msg.sys { color: #6b7280; font-size: 11px; }
  .msg.err { color: #fca5a5; font-size: 11.5px; }
  .step {
    color: #9ca3af; font-size: 11px; display: flex; gap: 6px; align-items: baseline;
    border-left: 2px solid #272b33; padding-left: 8px;
  }
  .step b { color: #c4b5fd; font-weight: 600; flex: 0 0 auto; }
  .step.ok b { color: #86efac; }
  .step.bad b { color: #fca5a5; }
  .step .res { color: #6b7280; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shot { max-width: 100%; border-radius: 6px; border: 1px solid #22252c; }
  .reason {
    color: #64748b; font-size: 10.5px; line-height: 1.5; font-style: italic; white-space: pre-wrap;
    border-left: 2px solid #164e63; padding-left: 8px; max-height: 140px; overflow-y: auto;
  }
  .reason::before { content: "raciocinio "; color: var(--neon); font-style: normal; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
  .log.hide-reason .reason { display: none; }
  .plan {
    border: 1px solid #1e3a8a; background: #0e1626; border-radius: 7px; padding: 7px 9px;
    font: 11px/1.5 ui-monospace, monospace; color: #cbd5e1; white-space: pre-wrap;
  }
  .plan .head { color: #93c5fd; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .composer { border-top: 1px solid #22252c; background: #101216; padding: 8px; display: flex; gap: 6px; align-items: flex-end; flex: 0 0 auto; }
  textarea {
    flex: 1; resize: none; min-height: 34px; max-height: 40vh; background: #16181d; color: #e5e7eb;
    border: 1px solid #262a32; border-radius: 8px; padding: 8px; font: inherit; outline: none;
  }
  textarea:focus { border-color: #3b82f6; }
  .send { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 8px 11px; font: inherit; cursor: pointer; font-weight: 600; }
  .send:disabled { background: #1f2937; color: #6b7280; cursor: default; }
  .hint { color: #4b5563; font-size: 10px; padding: 0 10px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot"></span>
    <span class="title">Swarm Pilot</span>
    <span class="meta">-</span>
    <button class="icon" data-act="settings" title="Opcoes">&#9881;</button>
    <button class="icon" data-act="clear" title="Limpar conversa">&#8635;</button>
  </div>
  <div class="target" id="target">aba alvo: <b>-</b></div>
  <div class="log" id="log"></div>
  <div class="hint">Enter envia - Shift+Enter quebra - /reason /model /neon /clear /opts</div>
  <div class="composer">
    <textarea id="ta" rows="1" placeholder="manda o que fazer no browser..."></textarea>
    <button class="send" id="send">Exec</button>
  </div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
