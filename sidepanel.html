<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Swarm Pilot</title>
<style>
  /* Estrutura "gordinha" estilo Duolingo (bordas grossas, botoes 3D, cantos grandes)
     com paleta e clima de hacker: preto, rosa e verde. */
  :root {
    color-scheme: dark;
    --bg: #0a0a0c; --bg2: #101014; --panel: #16161b; --panel2: #1e1e25;
    --line: #2b2b33; --line-d: #1a1a20;
    --text: #f4f4f6; --soft: #d6d6dc; --muted: #a3a3ad; --dim: #6e6e78;
    --pink: #ec1075; --pink-d: #b21e54; --pink-t: #ff6aa9;
    --green: #6bbd45; --green-d: #3d7d28; --green-t: #8fdc66;
    --red: #ff5a4a; --red-d: #a8332a;
    --blue: #4cc2ff; --violet: #c58bff; --yellow: #ffc800; --teal: #3ee0c1;
    --round: ui-rounded, "SF Pro Rounded", Nunito, "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; color: var(--text); font: 600 12.5px/1.45 var(--round);
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 0) 0 0 / 18px 18px,
      radial-gradient(520px 260px at 100% -40px, color-mix(in srgb, var(--pink) 16%, transparent), transparent 70%),
      radial-gradient(420px 240px at -10% 110%, color-mix(in srgb, var(--green) 9%, transparent), transparent 70%),
      var(--bg);
  }

  /* ---------- cabecalho ---------- */
  .bar { display: flex; align-items: center; gap: 9px; padding: 10px 12px; flex: 0 0 auto; background: var(--bg2); border-bottom: 2px solid var(--line); }
  .logo {
    width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 auto;
    background: var(--pink); box-shadow: 0 3px 0 var(--pink-d);
  }
  .logo svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .title { font: 900 15px/1 var(--round); letter-spacing: .01em; white-space: nowrap; }
  .dot { --c: var(--green); width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--c); border: 2px solid var(--bg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent); }
  .dot.busy { --c: var(--yellow); animation: ring 1.2s ease-out infinite; }
  .dot.err { --c: var(--red); }
  @keyframes ring {
    0% { box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 60%, transparent); }
    100% { box-shadow: 0 0 0 9px transparent; }
  }
  .meta {
    margin-left: auto; max-width: 46%; padding: 4px 10px; font: 700 10.5px/1.3 var(--mono); color: var(--muted);
    background: var(--panel); border: 2px solid var(--line); border-bottom-width: 3px; border-radius: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .icon {
    width: 32px; height: 32px; padding: 0; display: grid; place-items: center; cursor: pointer; flex: 0 0 auto;
    color: var(--muted); background: var(--panel); border: 2px solid var(--line); border-radius: 11px; box-shadow: 0 3px 0 var(--line);
    transition: transform .08s, box-shadow .08s, color .15s, border-color .15s;
  }
  .icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon:hover { color: var(--pink-t); border-color: color-mix(in srgb, var(--pink) 55%, var(--line)); box-shadow: 0 3px 0 color-mix(in srgb, var(--pink) 40%, var(--line)); }
  .icon:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
  .icon:focus-visible, .send:focus-visible { outline: 3px solid color-mix(in srgb, var(--pink) 60%, transparent); outline-offset: 2px; }

  .target {
    padding: 7px 12px; color: var(--dim); font: 700 10px/1.3 var(--mono); letter-spacing: .06em; text-transform: uppercase;
    background: var(--bg2); border-bottom: 2px solid var(--line-d); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto;
  }
  .target::before { content: "$"; margin-right: 8px; color: var(--green); font-weight: 800; }
  .target b { color: var(--soft); font-weight: 700; letter-spacing: 0; text-transform: none; font-size: 10.5px; }

  /* ---------- log ---------- */
  .log {
    flex: 1 1 auto; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .log::-webkit-scrollbar { width: 7px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .log::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--pink) 55%, var(--line)); }
  .log > * { flex: 0 0 auto; animation: pop .28s cubic-bezier(.34, 1.56, .64, 1) both; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }

  .msg { white-space: pre-wrap; word-break: break-word; }
  .msg.user, .msg.assistant {
    position: relative; padding: 10px 13px; font: 700 13px/1.5 var(--round);
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
  }
  .msg.user {
    align-self: flex-end; max-width: 90%; margin-right: 8px; color: #ffe3f0; border-bottom-right-radius: 6px;
    background: color-mix(in srgb, var(--pink) 16%, var(--panel)); border-color: color-mix(in srgb, var(--pink) 60%, var(--line));
  }
  .msg.user::after {
    content: ""; position: absolute; right: -7px; bottom: 10px; width: 11px; height: 11px; transform: rotate(-45deg);
    background: color-mix(in srgb, var(--pink) 16%, var(--panel)); border-left: 2px solid transparent; border-bottom: 2px solid transparent;
    border-right: 2px solid color-mix(in srgb, var(--pink) 60%, var(--line)); border-top: 0; border-bottom-color: color-mix(in srgb, var(--pink) 60%, var(--line));
  }
  .msg.assistant { margin-left: 8px; color: var(--text); background: var(--panel); border-bottom-left-radius: 6px; }
  .msg.assistant::before {
    content: ""; position: absolute; left: -7px; bottom: 10px; width: 11px; height: 11px; transform: rotate(45deg);
    background: var(--panel); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
  }
  .msg.assistant:empty { display: none; }
  .msg.sys { color: var(--dim); font: 600 10.5px/1.4 var(--mono); }
  .msg.err {
    color: #ffd6d1; font: 700 11.5px/1.45 var(--round); padding: 10px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--red) 12%, var(--panel)); border: 2px solid color-mix(in srgb, var(--red) 55%, var(--line)); border-bottom-width: 4px;
  }
  /* "passo N" vira divisor de secao */
  .msg.sys.pass {
    display: flex; align-items: center; gap: 10px; margin-top: 6px; color: var(--muted);
    font: 800 10px/1 var(--round); letter-spacing: .16em; text-transform: uppercase;
  }
  .msg.sys.pass::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: var(--line); }

  /* ---------- passos (chamada + resultado no mesmo card) ---------- */
  .step-card {
    overflow: hidden; font-size: 11px; background: var(--panel);
    border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px; transition: border-color .2s, background .2s;
  }
  .step-card.bad { background: color-mix(in srgb, var(--red) 11%, var(--panel)); border-color: color-mix(in srgb, var(--red) 60%, var(--line)); }
  .step-card.done { background: color-mix(in srgb, var(--green) 14%, var(--panel)); border-color: var(--green-d); }
  .step { display: flex; gap: 9px; align-items: flex-start; padding: 9px 12px; color: var(--muted); }
  .step + .step, .step-card .msg.sys { border-top: 2px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .step-card .msg.sys { padding: 6px 12px; background: rgba(0,0,0,.2); }
  .step b {
    --c: var(--violet); flex: 0 0 auto; padding: 4px 8px; border-radius: 9px;
    font: 800 10px/1 var(--round); letter-spacing: .06em; text-transform: uppercase; color: var(--c);
    background: color-mix(in srgb, var(--c) 15%, transparent);
    border: 2px solid color-mix(in srgb, var(--c) 45%, transparent); border-bottom-width: 3px;
  }
  .step b[data-kind="nav"] { --c: var(--blue); }
  .step b[data-kind="act"] { --c: var(--violet); }
  .step b[data-kind="look"] { --c: var(--teal); }
  .step b[data-kind="think"] { --c: var(--yellow); }
  .step b[data-kind="done"] { --c: var(--green-t); }
  .step.ok b { --c: var(--green-t); }
  .step.bad b { --c: var(--red); }
  .step .res {
    flex: 1; min-width: 0; padding-top: 3px; font: 600 11px/1.45 var(--mono); color: var(--muted); overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .step .res:hover { -webkit-line-clamp: unset; }
  .step.ok .res { color: var(--soft); }
  .step.bad .res { color: #ffb3aa; }

  .shot { max-width: 100%; border-radius: 14px; border: 2px solid var(--line); border-bottom-width: 4px; }

  .reason {
    color: var(--muted); font: italic 600 10.5px/1.55 var(--round); white-space: pre-wrap; max-height: 140px; overflow-y: auto;
    padding: 9px 12px; border-radius: 14px;
    background: color-mix(in srgb, var(--pink) 6%, transparent); border: 2px dashed color-mix(in srgb, var(--pink) 35%, var(--line));
  }
  .reason::before {
    content: "raciocinio"; display: block; margin-bottom: 3px; color: var(--pink-t); font: 800 9.5px/1.3 var(--round);
    font-style: normal; letter-spacing: .14em; text-transform: uppercase;
  }
  .log.hide-reason .reason { display: none; }

  /* plano: barra de progresso grande + checklist */
  .plan {
    padding: 11px 13px 12px; color: var(--soft); font: 700 11.5px/1.5 var(--round);
    background: var(--panel); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 16px;
  }
  .plan .head { display: block; margin-bottom: 9px; color: var(--pink-t); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
  .plan .head span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plan .track { display: block; height: 14px; margin-top: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .plan .track i { position: relative; display: block; height: 100%; border-radius: 999px; background: var(--pink); transition: width .45s cubic-bezier(.34, 1.56, .64, 1); }
  .plan .track i::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.32); }
  .pstep { position: relative; padding: 2px 0 2px 26px; white-space: pre-wrap; color: var(--soft); }
  .pstep::before {
    content: ""; position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 6px;
    background: var(--bg2); border: 2px solid var(--line); border-bottom-width: 3px;
  }
  .pstep.done { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 2px; }
  .pstep.done::before { background: var(--green); border-color: var(--green-d); }
  .pstep.done::after {
    content: ""; position: absolute; left: 5.5px; top: 5px; width: 4px; height: 8px; transform: rotate(45deg);
    border: solid #0a0a0c; border-width: 0 2.5px 2.5px 0;
  }

  /* ---------- entrada: um campo so, com o botao dentro ---------- */
  .dock { flex: 0 0 auto; background: var(--bg2); border-top: 2px solid var(--line); }
  .composer { padding: 12px 12px 6px; }
  .field {
    display: flex; gap: 8px; align-items: flex-end; padding: 6px 6px 6px 14px;
    background: var(--panel); border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px;
    transition: border-color .15s;
  }
  .field:focus-within { border-color: color-mix(in srgb, var(--pink) 75%, var(--line)); }
  textarea {
    flex: 1; min-width: 0; resize: none; min-height: 36px; max-height: 40vh; padding: 8px 0; border: 0; outline: none;
    font: 600 12.5px/1.45 var(--mono); color: var(--text); background: transparent;
  }
  textarea::placeholder { color: var(--dim); }
  .send {
    flex: 0 0 auto; height: 36px; padding: 0 18px; border: 0; border-radius: 12px; cursor: pointer;
    color: #fff; background: var(--pink); box-shadow: 0 3px 0 var(--pink-d);
    font: 900 12px/1 var(--round); letter-spacing: .1em; text-transform: uppercase;
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .send:hover { filter: brightness(1.1); }
  .send:active { transform: translateY(3px); box-shadow: 0 0 0 transparent; }
  .send:disabled { cursor: default; filter: none; transform: none; color: var(--dim); background: var(--panel2); box-shadow: 0 3px 0 var(--line-d); }
  body[data-busy="true"] .send:disabled { color: var(--yellow); }

  .hint { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; padding: 0 16px 11px; color: var(--dim); font: 700 10px/1.4 var(--round); }
  .hint kbd { padding: 0; font: 700 10px/1.3 var(--mono); color: var(--muted); background: none; border: 0; }
  .hint .dotsep { color: var(--line); }
  /* chips de comando so aparecem quando o texto comeca com "/" */
  .cmds { display: none; flex: 1 0 100%; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  body[data-ta^="/"] .cmds { display: flex; animation: pop .22s cubic-bezier(.34, 1.56, .64, 1) both; }
  .hint code {
    padding: 2px 7px; font: 700 10.5px/1.3 var(--mono); color: var(--pink-t); cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: 8px; box-shadow: 0 2px 0 var(--line);
    transition: transform .08s, box-shadow .08s, border-color .15s;
  }
  .hint code:hover { border-color: color-mix(in srgb, var(--pink) 55%, var(--line)); }
  .hint code:active { transform: translateY(2px); box-shadow: 0 0 0 transparent; }

  @media (prefers-reduced-motion: reduce) {
    .log > *, .dot.busy { animation: none; }
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><polyline points="5 7 11 12 5 17"/><line x1="13" x2="19" y1="18" y2="18"/></svg></span>
    <span class="title">Swarm Pilot</span>
    <span class="dot" title="status"></span>
    <span class="meta">-</span>
    <button class="icon" data-act="settings" title="Opcoes" aria-label="Opcoes">
      <svg viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg>
    </button>
    <button class="icon" data-act="clear" title="Limpar conversa" aria-label="Limpar conversa">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
    </button>
  </div>
  <div class="target" id="target">aba alvo: <b>-</b></div>
  <div class="log" id="log"></div>
  <div class="dock">
    <div class="composer">
      <div class="field">
        <textarea id="ta" rows="1" placeholder="manda o que fazer no browser..."></textarea>
        <button class="send" id="send">Exec</button>
      </div>
    </div>
    <div class="hint">
      <kbd>Enter</kbd> envia <span class="dotsep">&middot;</span> <kbd>Shift+Enter</kbd> quebra <span class="dotsep">&middot;</span> <kbd>/</kbd> comandos
      <div class="cmds">
        <code>/reason</code> <code>/model</code> <code>/neon</code> <code>/clear</code> <code>/opts</code>
      </div>
    </div>
  </div>
<script type="module" src="sidepanel.js"></script>
</body>
</html>
